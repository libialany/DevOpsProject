apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: demo
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while true; do sleep 10; done;"]
          resources:
            limits:
              memory: 10Mi
              cpu: 20m
            requests:
              memory: 1Mi
              cpu: 1m