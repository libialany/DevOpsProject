apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-trigger-auth-aws-credentials
  namespace: default
spec:
  secretTargetRef:
  - key: AWS_SQS_QUEUE_URL
    parameter: queueURL
    name: aws-credentials
  - key: AWS_ACCESS_KEY_ID
    name: aws-credentials
    parameter: awsAccessKeyID
  - key: AWS_SECRET_ACCESS_KEY
    name: aws-credentials
    parameter: awsSecretAccessKey
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: aws-sqs-queue-scaledobject
  namespace: default
spec:
  scaleTargetRef:
    name: order-processor
  minReplicaCount: 0 
  maxReplicaCount: 2 
  pollingInterval: 10
  cooldownPeriod: 15     
  triggers:
  - type: aws-sqs-queue
    authenticationRef:
      name: keda-trigger-auth-aws-credentials
    metadata:
      queueURL: "https://sqs.us-east-1.amazonaws.com/<user-id>/keda"
      queueLength: "2"
      awsRegion: "us-east-1"
