name: DB Stop at night
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read


concurrency:
  group: db-scheduler
  cancel-in-progress: false

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: AWS OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE }}
          aws-region: us-east-1
      
      - name: stop db 
        run: |
          set -euo pipefail
          STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier demo-db \
            --query 'DBInstances[0].DBInstanceStatus' \
            --output text)
          if [ "$STATUS" = "stopped" ]; then
            echo "Already stopped — nothing to do."
            exit 0
          elif [ "$STATUS" != "available" ]; then
            echo "Instance is '$STATUS', refusing to act. Exiting."
            exit 1
          fi

          aws rds stop-db-instance --db-instance-identifier ${{ secrets.DB_IDENTIFIER }}

          aws rds wait db-instance-stopped --db-instance-identifier ${{ secrets.DB_IDENTIFIER }}