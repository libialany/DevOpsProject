on:
  push:
    tags:
      - "v*"
permissions:
  contents: read

jobs: 
  test:
    runs-on: ubuntu-latest
    name: Lint and Test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip && pip install -r requirements.txt && pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .

      - name: Test
        run: |
          pytest tests
      
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |  
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/demo:${{ steps.version.outputs.version }} \
          -t ${{ secrets.DOCKER_USERNAME }}/demo:latest \
          .
      - name: Push Docker Image
        run: | 
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/demo:${{ steps.version.outputs.version }}

          docker push \
          ${{ secrets.DOCKER_USERNAME }}/demo:latest