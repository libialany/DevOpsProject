name: Terraform

on:
  push: 
    branches:
      - main
  pull_request:

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: set up terraform
        uses: hashicorp/setup-terraform@v2

      - name: terraform init
        run: terraform init
      
      - name: terraform plan
        run: terraform plan

      - name: terraform apply
        run: terraform apply