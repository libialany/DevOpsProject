name: Manual Trigger Workflow with loglevel & tags
on:
  push:
    branches:
      - notsubcribers
jobs:
  sns-review:
    runs-on: ubuntu-latest
    steps:
      - name: Starting the scanning
        run: echo "Start the scanning"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Run the main script
        run: |
          pip install boto3
          python main.py