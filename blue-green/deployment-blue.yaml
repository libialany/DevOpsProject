apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-blue
spec: 
  replicas: 3
  selector:
    matchLabels: 
      app: myapp
      version: blue
  template:
    metadata:
      labels: 
        app: myapp
        version: blue
    spec:
      containers:
        - name: myapp
          image: gcr.io/kuar-demo/kuard-amd64:1
          ports:
            - containerPort: 8080
