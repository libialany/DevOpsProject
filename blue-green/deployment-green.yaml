apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-green
spec: 
  replicas: 3
  selector:
    matchLabels:
      app: app-green
  template:
    metadata:
      labels: 
        app: app-green
        version: green
    spec:
      containers:
        - name: app-green
          image: gcr.io/kuar-demo/kuard-amd64:1