apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-green
spec: 
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels: 
        app: myapp
        version: green
    spec:
      containers:
        - name: myapp
          image: gcr.io/kuar-demo/kuard-amd64:1
          ports:
            - containerPort: 8080
