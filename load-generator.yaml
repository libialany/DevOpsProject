apiVersion: v1
kind: Pod
metadata:
  name: load-generator
spec:
  containers:
    - name: load-generator
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "Starting load generator - delete this pod to stop the load"
          for i in 1 2 3 4 5 6 7 8; do
            ( while true; do wget -q -O- http://busybox-web:8080/cgi-bin/busy.cgi > /dev/null; done ) &
          done
          wait
      resources:
        requests:
          cpu: 50m
        limits:
          cpu: 200m
  restartPolicy: Never
