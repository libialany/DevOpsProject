apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  labels:
    app: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /www/cgi-bin
              cp /config/index.html /www/index.html
              cp /config/busy.cgi /www/cgi-bin/busy.cgi
              chmod +x /www/cgi-bin/busy.cgi
              exec httpd -f -v -p 8080 -h /www
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 32Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: www
              mountPath: /www
      volumes:
        - name: config
          configMap:
            name: webpage
        - name: www
          emptyDir: {}

